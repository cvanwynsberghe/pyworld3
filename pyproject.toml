[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyworld3"
version = "1.1"
description = "The World3 model revisited in Python"
readme = "README.md"
license = {text = "CeCILL-2.1"}
authors = [
    {name = "Charles Vanwynsberghe"}
]
keywords = ["system-dynamics", "world3", "simulation", "limits-to-growth"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: CEA CNRS Inria Logiciel Libre License, version 2.1 (CeCILL-2.1)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]

[project.urls]
Homepage = "https://github.com/cvanwynsberghe/pyworld3"
Repository = "https://github.com/cvanwynsberghe/pyworld3.git"
Issues = "https://github.com/cvanwynsberghe/pyworld3/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["*.json"]
